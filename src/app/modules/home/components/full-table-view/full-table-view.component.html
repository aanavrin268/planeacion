<div class="main-content">
    <section class="header">

    </section>
    <section class="body">
        <span class="title">Vista previa nueva tabla</span>

        <div class="table-container">
            <div cdkDropList cdkDropListOrientation="horizontal" 
                (cdkDropListDropped)="drop($event)"
                class="header-row">
                <div *ngFor="let column of displayedColumns"
                    class="header-cell"
                    cdkDrag>
                    <span class="sort-header"
                        (click)="sortData(column)">
                        {{column}}
                        <mat-icon *ngIf="sort.active === column"
                            class="sort-icon">
                            {{ sort.direction === 'asc' ? 'arrow_upward': 'arrow_downward'}}
                        </mat-icon>
                        <div class="drag-handle"
                            cdkDragHandle>☰</div>
                    </span>

                </div>
                
            </div>


            <table mat-table [dataSource]="dataSource">
                <ng-container *ngFor="let column of displayedColumns"
                    [matColumnDef]="column">
                    <td mat-cell *matCellDef="let element">
                        {{ element[column]}}
                    </td>
                </ng-container>

                <tr mat-row *matRowDef="let row; columns: displayedColumns">
                    
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[3, 20, 50]"
                showFirstLastButtons></mat-paginator>
        </div>
    </section>
</div>
