<div class="main-modal">
    <section class="header">
        <span class="title">{{tableTitle || 'Título no disponible'}}</span>
        <i class="bi bi-x-lg t-icon"
            (click)="close()"></i>
    </section>
    <section class="body">
        <span class="sub">{{tableText || 'Descripción no disponible...'}}</span>

        <div class="search-container">
            <input type="text" placeholder="Busca algo..."
                [(ngModel)]="searchText"
                (input)="filterData()"
            >
        </div>

<!-- HTML Template -->
<!-- HTML Template -->
<div class="table-container">
    <div class="header-actions">
      <h2>{{ tableTitle }}</h2>
      <div class="search-container">
        <input type="text" [(ngModel)]="searchText" (input)="filterData()" placeholder="Buscar...">
      </div>
    </div>
  
    <div cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)" class="header-row">
      <div *ngFor="let column of displayedColumns" class="header-cell" cdkDrag>
        <span (click)="sortData(column)" class="sort-header">
          {{ column }}
          <!-- Indicador de ordenamiento -->
          <mat-icon *ngIf="sort.active === column" class="sort-icon">
            {{ sort.direction === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
          </mat-icon>
        </span>
        <div class="drag-handle" cdkDragHandle>☰</div>
      </div>
    </div>
  
    <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
      </ng-container>
  
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  
    <span *ngIf="dataSource.data.length === 0" class="no-results">
      No se encontraron resultados
    </span>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  
    <div class="actions">
      <button (click)="close()" class="close-btn">Cerrar</button>
    </div>
  </div>


    </section>
</div>
