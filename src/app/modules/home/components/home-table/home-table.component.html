<div class="main-modal">
    <section class="header">
        <span class="title">{{tableTitle || 'Título no disponible'}}</span>
        <i class="bi bi-x-lg t-icon"
            (click)="close()"></i>
    </section>
    <section class="body">
        <span class="sub">{{tableText || 'Descripción no disponible...'}}</span>

        <div class="search-container">
            <input type="text" placeholder="Busca algo..."
                [(ngModel)]="searchText"
                (input)="filterData()"
            >
        </div>

<!-- HTML Template -->
<div class="table-container">
    <div cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)" class="header-row">
      <div *ngFor="let column of displayedColumns" class="header-cell" cdkDrag>
        {{ column }}
        <div class="drag-handle">☰</div>
      </div>
    </div>
  
    <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
      </ng-container>
  
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  
    <span *ngIf="dataSource.data.length === 0" class="no-results">
      No se encontraron resultados
    </span>
  
    <mat-paginator [pageSizeOptions]="[3, 5, 20]" showFirstLastButtons></mat-paginator>
  </div>



    </section>
</div>
