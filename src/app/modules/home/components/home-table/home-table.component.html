<div class="main-modal">
    <section class="header">
        <span class="title">{{tableTitle || 'Título no disponible'}}</span>
        <i class="bi bi-x-lg t-icon"
            (click)="close()"></i>
    </section>
    <section class="body">
        <span class="sub">{{tableText || 'Descripción no disponible...'}}</span>

        <div class="search-container">
            <input type="text" placeholder="Busca algo..."
                [(ngModel)]="searchText"
                (input)="filterData()"
            >
        </div>

<!-- HTML Template -->
<!-- HTML Template -->
<div class="table-container">
  <div class="table-actions">
      <button mat-icon-button (click)="startColumnCombination()" 
              title="Combinar columnas"
              [disabled]="isSelectingForCombination">
          <mat-icon>link</mat-icon>
      </button>
      
      <ng-container *ngIf="isSelectingForCombination">
          <button mat-icon-button (click)="createCombinedColumn('concat')" 
                  title="Concatenar texto"
                  [disabled]="selectedColumnsForCombination.length < 2">
              <mat-icon>text_fields</mat-icon>
          </button>
          
          <button mat-icon-button (click)="createCombinedColumn('sum')"
                  title="Sumar valores"
                  [disabled]="selectedColumnsForCombination.length < 2">
              <mat-icon>add</mat-icon>
          </button>
          
          <button mat-icon-button (click)="cancelColumnCombination()"
                  title="Cancelar">
              <mat-icon>close</mat-icon>
          </button>
      </ng-container>
  </div>

  <div cdkDropList cdkDropListOrientation="horizontal" 
      (cdkDropListDropped)="drop($event)"
      class="header-row">
      <div *ngFor="let column of displayedColumns"
          class="header-cell"
          cdkDrag
          [class.selected-for-combination]="selectedColumnsForCombination.includes(column)">
          <span class="sort-header"
              (click)="isSelectingForCombination ? toggleColumnSelection(column) : sortData(column)">
              {{column}}
              <mat-icon *ngIf="sort.active === column && !isSelectingForCombination"
                  class="sort-icon">
                  {{ sort.direction === 'asc' ? 'arrow_upward': 'arrow_downward'}}
              </mat-icon>
              <mat-icon *ngIf="isSelectingForCombination && selectedColumnsForCombination.includes(column)"
                  class="selection-icon">
                  check_circle
              </mat-icon>
              <div class="drag-handle"
                  cdkDragHandle>☰</div>
          </span>
      </div>
  </div>

  <table mat-table [dataSource]="dataSource">
      <ng-container *ngFor="let column of displayedColumns"
          [matColumnDef]="column">
          <td mat-cell *matCellDef="let element">
              {{ element[column]}}
          </td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[3, 20, 50]"
      showFirstLastButtons></mat-paginator>
</div>


    </section>
</div>
