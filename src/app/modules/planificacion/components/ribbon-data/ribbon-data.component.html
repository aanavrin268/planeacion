<div class="main-ribbon">
    <section class="backup">
        <header>
            <span class="title">Backups</span>
        </header>
        <main>

            <div class="data-container">
                <div class="btn-container"
                    (click)="addNewHistoric()">
                    <i class="bi bi-plus-lg"></i>
                    <span>
                    Nuevo
                    </span>
                </div> 
                
                
                <div class="btn-container"
                    (click)="overwriteHistoric()">
                    <i class="bi bi-copy"></i>                   
                     <span>
                    Sobrescribir
                    </span>
                </div>     
                

            </div>
        </main>
    </section>

    <section class="backup">
        <header>
            <span class="title">Edición</span>
        </header>
        <main>

            <div class="data-container">

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault"
                        (change)="onSwitchChange($event)">
                    <label class="form-check-label" for="flexSwitchCheckDefault">Modo edición</label>
                  </div>


                <!----
                
                      <button class="r-btn" (click)="allowEdits()">Editar</button>
                <button class="r-btn" (click)="activateMultiEdit()">Edición múltiple</button>
                
                -->
              


            </div>
        </main>
    </section>

    <section class="backup">
        <header>
            <span class="title">Funciones</span>
        </header>
        <main>
            <div class="data-container">
                <div class="btn-container"
                (click)="addNewAgregate()">
                    <i class="bi bi-alt"></i>
                    <span>
                        Agregadas
                    </span>
             </div> 
            

            </div>
        </main>
    </section>
</div>
