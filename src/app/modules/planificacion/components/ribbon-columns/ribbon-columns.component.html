<div class="main-ribbon">
    <section class="r-section">
        <header class="r-header">
            <span class="title">Visualización</span>
        </header>
        <main class="r-main">

            <div class="data-container">

             
                                       

                                       
                    <div class="custom-dropdown" [class.open]="isDropdownOpen">
                        <button class="dropdown-toggle" (click)="toggleDropdown()">
                          Visibles
                        </button>
                        <div class="dropdown-menu">
                            <div *ngFor="let column of (visibleColumns$ | async)" class="dropdown-item">
                                <label>
                                  <input type="checkbox" 
                                         [checked]="column.visible" 
                                         (change)="toggleColumnVisibility(column)">  
                                         {{ column.header }}
                                        </label>
                                      </div>


                        </div>
                    </div>

                    <div class="custom-dropdown"
                                [class.open]="isDropdownHideOpen">
                                <button class="dropdown-toggle"
                                    (click)="toggleHideDropwon()">
                                    Ocultas
                                </button>
                                <div class="dropdown-menu">
                                    <div *ngFor="let column of (hiddenColumns$ | async)" class="dropdown-item">
                                        <label>
                                          <input type="checkbox"
                                                 [checked]="!column.visible"
                                                 (change)="toggleColumnVisibility(column)">  
                                          {{ column.header }}
                                        </label>
                                      </div>
                                </div>

                    </div>


                    </div>


        </main>
    </section>

    <section class="r-section">
        <header class="r-header">
            <span class="title">Grupos</span>
        </header>
        <main class="r-main">

            <div class="data-container">
                
            </div>

        </main>
    </section>

    <section class="r-section">
        <header class="r-header">
            <span class="title">Vistas</span>
        </header>
        <main class="r-main">

            <div class="data-container">

                <div class="btn-container" (click)="addView()">
                    <i class="bi bi-plus-lg"></i>
                    <span>
                    Nueva
                    </span>
                </div>
                
            </div>

        </main>
    </section>
</div>
