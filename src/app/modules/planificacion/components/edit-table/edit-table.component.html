<div class="table-container" #tableContainer>
    <div class="multi-container" *ngIf="getSelectedRows().length > 0">
      <span class="mt-text">{{infotText}}</span>

      <div class="btns-container">
        <i class="bi bi-pencil-square mt-icon" (click)="openMultiWindow()"></i>
        <i class="bi bi-trash3 mt-icon" (click)="deleteAllSelection()"></i>
      </div>

    </div>

    <table class="excel-grid">
        <thead>
          <tr *ngIf="groups.length > 0">
            <ng-container *ngFor="let col of (visibleColumnss$ | async); let i = index">
              <td *ngIf="isGroupStartColumn(col.key)"
                  [attr.colspan]="getGroupColspan(col.key)"
                  [style.background-color]="groupColor"
                  [style.border-color]="groupColor">
                {{ getGroupForColumn(col.key)?.label }}
              </td>
              <td *ngIf="!isGroupStartColumn(col.key)"></td>
            </ng-container>
          </tr>
          <tr>
            <th *ngFor="let col of (visibleColumnss$ | async); trackBy: trackByColumnKey"
                [style.width.px]="col.width"
                [style.background-color]="headerColor"
                [style.font-size]="getFontSize(col.width)"
                class="resizable"
                [attr.data-key]="col.key">


                <ng-container *ngIf="col.key === 'acciones'; else defaultHeader">
                  <label class="checkbox-container">
                    <input type="checkbox" 
                           [checked]="allSelected"
                           [indeterminate]="isSomeSelected"
                           (change)="toggleSelectAll($event)">
                    <span>{{ col.header }}</span>
                  </label>

                </ng-container>

                <ng-template #defaultHeader>
                  {{ col.header }}

                </ng-template>

            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of data; let rowIndex = index"
          [ngClass]="{'selected-row': isSingleRowSelected && currentRowKey === row['nombre']}"
          >
            <td *ngFor="let col of (visibleColumnss$ | async); trackBy: trackByColumnKey"
                [style.width.px]="col.width"
                [style.font-size]="getFontSize(col.width)"
                [attr.data-key]="col.key"
                (dblclick)="isEditableColumn(col.key) ? startEditing(rowIndex, col.key) : null"
                (click)="stopEditing()"
                [class.non-editable]="!isEditableColumn(col.key)">
              
              <!-- Columna de Acciones (checkbox) -->
              <ng-container *ngIf="col.key === 'acciones'">
                <div class="accions">
                  <input type="checkbox" 
                  [checked]="row.selected || false"
                  (change)="handleCheckboxChange(row, $event)">

                  <div class="icons-container">

                    <i class="bi bi-arrow-right-square-fill a-icon"
                    (click)="onSingleRowSelected(row)"></i>

                    <i *ngIf="isSingleRowSelected && currentRowKey === row['nombre']" 
                    class="bi bi-x-square-fill a-icon red"
                    (click)="resetSingleRow()"></i>

                  </div>

                

                </div>
               
             </ng-container>
              
              <!-- Otras columnas editables -->
              <ng-container *ngIf="col.key !== 'acciones'">
                <!-- Input de edición -->
                <input *ngIf="editing.active && editing.rowIndex === rowIndex && editing.columnKey === col.key && isEditableColumn(col.key)"
                       #cellInput
                       type="text"
                       [value]="row[col.key]"
                       (blur)="saveEditing($event, row, col.key)"
                       (keyup.enter)="saveEditing($event, row, col.key)"
                       (keyup.escape)="stopEditing()"
                       class="cell-input">
                
                <!-- Valor normal -->
                <span *ngIf="!(editing.active && editing.rowIndex === rowIndex && editing.columnKey === col.key)">
                  {{ row[col.key] }}
                </span>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
</div>
