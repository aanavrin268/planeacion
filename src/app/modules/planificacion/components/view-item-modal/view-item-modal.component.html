<div class="main-modal">
    <header>
        <div class="menu">
            <span class="m-item"
                (click)="showInfo()">
                Detalles
            </span>

            <span class="m-item"
                (click)="showCost()">
                Costos
            </span>

        </div>
        <i class="bi bi-x-lg close" (click)="close()"></i>
    </header>
    <main>
        <div class="left">
            <div class="image-container">
                <img class="m-image" src="images/van/vangorn.png" alt="">
            </div>
        </div>
        <div class="right" *ngIf="!showCostos">
            <div class="title-container">
                <span class="title">{{ currentItem.nombre }}</span>
                <span class="badge"> {{ currentItem.origin}}</span>
            </div>

            <div class="indicator-container">
                <div class="indicator">
                    <i class="bi bi-capsule i-icon"></i>
                <span class="i-title">PT</span>
                <span class="i-sub-title">
                    Se trata de un producto terminado.
                </span>
                </div>

                <div class="indicator">
                    <i class="bi bi-boxes i-icon"></i>
                <span class="i-title">Proveedores</span>
                <span class="i-sub-title">
                    Este PT es surtido por 2 proveedores diferentes.
                </span>
                </div>

                <div class="indicator end">
                    <i class="bi bi-prescription i-icon"></i>
                <span class="i-title">Presentación</span>
                <span class="i-sub-title">
                    Actualmente cuenta con 3 presentaciones diferentes.
                </span>
                </div>
                
                
            </div>



        </div>

        <div class="right" *ngIf="showCostos">
           <div class="costos-container">
                <span class="sub">Tabla de costos actuales</span>

                <table mat-table [dataSource]="dataSource">
                    <ng-container *ngFor="let column of displayedColumns"
                        [matColumnDef]="column">
                        <th mat-header-cell *matHeaderCellDef>
                            {{ column }}
                        </th>
                        <td mat-cell *matCellDef="let element; let i = index"
                        [ngStyle]="{'background-color': 'rgb(97 97 97 / 19%)'}"
                        >
                            {{ element[column]}}
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
           </div>
        </div>
    </main>

</div>
