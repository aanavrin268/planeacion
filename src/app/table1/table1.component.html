<div class="table-container">
    <table class="draggable-table">
      <thead>
        <tr>
          <th *ngFor="let columna of columnas; let i = index" 
              draggable="true"
              (dragstart)="iniciarDrag(i)"
              (dragover)="permitirSoltar($event)"
              (drop)="soltarColumna(i)"
              [class.dragging]="columnaDrag === i">
            {{ columna.title }}
            <div class="drag-handle">⋮⋮</div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td *ngFor="let columna of columnas">
            <span *ngIf="columna.key !== 'salario'">{{ obtenerValorCelda(usuario, columna.key) }}</span>
            <span *ngIf="columna.key === 'salario'">{{ obtenerValorCelda(usuario, columna.key) | currency:'EUR':'symbol':'1.0-0' }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <div class="info-panel">
    <h3>Instrucciones:</h3>
    <p>Puedes reorganizar las columnas de la tabla arrastrando los encabezados.</p>
  </div>
