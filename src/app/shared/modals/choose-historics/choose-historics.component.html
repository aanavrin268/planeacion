<div class="main-modal">
    <section class="header">
        <span class="title">Sobrescribir archivo</span>
    </section>
    <section class="body">
        <span class="sub-title">
            Selecciona el archivo sobre el cuál deseas guardar la nueva versión.
        </span>

        <div class="list-container">
            <div class="list-item" *ngFor="let item of listData; let i = index"
                [ngClass]="{'selected': isPlanSelected && i === selectedPlanId }"
                (click)="onSelectItem(item, i)">
                {{ item.name}}
            </div>
        </div>

    </section>
    <section class="footer">
      
            <button class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
            <button class="btn btn-primary" (click)="onSave()">Aceptar</button>

     
    </section>
</div>
